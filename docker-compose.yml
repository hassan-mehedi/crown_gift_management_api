version: '3.8'

services:
  # Crown Gift Management API
  api:
    build: .
    container_name: crown_gift_api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/crown_gift_management
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads  # Mount volume for file uploads if needed
    restart: unless-stopped
    networks:
      - crown_network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: crown_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=crown_gift_management
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro  # Optional: for initialization scripts
    restart: unless-stopped
    networks:
      - crown_network

  # MongoDB Express (Web-based MongoDB admin interface) - Optional
  mongo-express:
    image: mongo-express:1.0.2
    container_name: crown_mongo_express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password123@mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - crown_network

volumes:
  mongodb_data:
    driver: local

networks:
  crown_network:
    driver: bridge
